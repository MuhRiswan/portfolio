<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" fill="#0b0f1a"/>
  
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#222f49" stroke-width="0.5" opacity="0.5"/>
    </pattern>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#256af4" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#0b0f1a" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <circle cx="1000" cy="150" r="300" fill="#256af4" opacity="0.1" filter="blur(80px)"/>
  <circle cx="200" cy="500" r="200" fill="#256af4" opacity="0.05" filter="blur(60px)"/>

  <rect x="100" y="120" width="80" height="80" rx="20" fill="#256af4"/>
  <text x="140" y="175" font-family="system-ui, sans-serif" font-size="40" font-weight="900" fill="#ffffff" text-anchor="middle">M</text>

  <text x="100" y="320" font-family="system-ui, sans-serif" font-size="80" font-weight="900" fill="#ffffff" letter-spacing="-2">
    M.Riswan
  </text>
  <text x="100" y="400" font-family="system-ui, sans-serif" font-size="48" font-weight="700" fill="#90a4cb" letter-spacing="-1">
    Full-Stack Developer
  </text>

  <text x="100" y="520" font-family="system-ui, sans-serif" font-size="24" font-weight="600" fill="#256af4" letter-spacing="4" text-transform="uppercase">
    PORTFOLIO &amp; CASE STUDIES
  </text>

  <g transform="translate(850, 490)">
    <rect x="0" y="0" width="120" height="40" rx="20" fill="#182234" stroke="#222f49"/>
    <text x="60" y="26" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#ffffff" text-anchor="middle">Next.js 15</text>
    
    <rect x="135" y="0" width="120" height="40" rx="20" fill="#182234" stroke="#222f49"/>
    <text x="195" y="26" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#ffffff" text-anchor="middle">TypeScript</text>
  </g>
</svg>
